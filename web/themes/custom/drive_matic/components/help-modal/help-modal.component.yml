'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Aide :: Modale illustrée'
status: stable
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
props:
  type: object
  required:
    - id
    - title
    - fallback
  properties:
    id:
      type: string
      title: Identifiant
      description: 'Identifiant unique, sert à lier le déclencheur à sa modale.'
    title:
      type: string
      title: Titre de la modale
    fallback:
      type: string
      title: Texte de repli
      description: 'Phrase affichée quand le JS ne tourne pas, à la place du déclencheur.'
    image:
      type: string
      title: URL du visuel
    image_alt:
      type: string
      title: Alternative textuelle du visuel
    image_width:
      type: integer
      title: Largeur intrinsèque du visuel
    image_height:
      type: integer
      title: Hauteur intrinsèque du visuel
