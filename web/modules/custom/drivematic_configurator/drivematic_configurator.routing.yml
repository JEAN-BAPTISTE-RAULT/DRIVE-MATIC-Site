entity.quote.canonical:
  path: '/admin/content/devis/{quote}'
  defaults:
    _controller: '\Drupal\drivematic_configurator\Controller\QuoteDetailController::view'
    _title_callback: '\Drupal\drivematic_configurator\Controller\QuoteDetailController::title'
  requirements:
    _entity_access: 'quote.view'
  options:
    _admin_route: true
    parameters:
      quote:
        type: entity:quote

drivematic_configurator.configuration:
  path: '/configurer'
  defaults:
    _form: '\Drupal\drivematic_configurator\Form\ConfigurationForm'
    _title: 'Configurez votre véhicule et obtenez votre tarif'
  requirements:
    _role: 'partenaire'

drivematic_configurator.quote:
  path: '/configurer/devis'
  defaults:
    _form: '\Drupal\drivematic_configurator\Form\QuoteForm'
    _title: 'Votre devis'
  requirements:
    _role: 'partenaire'

drivematic_configurator.quote_configuration_delete:
  path: '/configurer/devis/configuration/{configuration_key}/supprimer'
  defaults:
    _form: '\Drupal\drivematic_configurator\Form\QuoteConfigurationDeleteForm'
    _title: 'Supprimer une configuration'
  requirements:
    _role: 'partenaire'
    configuration_key: '\d+'

drivematic_configurator.delivery:
  path: '/configurer/livraison'
  defaults:
    _form: '\Drupal\drivematic_configurator\Form\DeliveryForm'
    _title: 'Livraison'
  requirements:
    _role: 'partenaire'

drivematic_configurator.delivery_address_add:
  path: '/configurer/livraison/adresse/ajouter'
  defaults:
    _form: '\Drupal\drivematic_configurator\Form\DeliveryAddressForm'
    _title: 'Ajouter une nouvelle adresse'
  requirements:
    _role: 'partenaire'

drivematic_configurator.delivery_address_edit:
  path: '/configurer/livraison/adresse/{delivery_address}/modifier'
  defaults:
    _form: '\Drupal\drivematic_configurator\Form\DeliveryAddressForm'
    _title: 'Modifier une adresse'
  requirements:
    # Les deux exigences se cumulent (ET) : `_role` maintient la
    # redirection anonyme->connexion sitewide (PartnerAccessRedirectSubscriber
    # ne l'applique qu'aux routes portant explicitement `_role: partenaire`) ;
    # `_entity_access` empeche un partenaire connecte d'agir sur l'adresse
    # d'un autre (IDOR).
    _role: 'partenaire'
    _entity_access: 'delivery_address.update'
  options:
    parameters:
      delivery_address:
        type: entity:delivery_address

drivematic_configurator.delivery_address_delete:
  path: '/configurer/livraison/adresse/{delivery_address}/supprimer'
  defaults:
    _form: '\Drupal\drivematic_configurator\Form\DeliveryAddressDeleteForm'
    _title: 'Supprimer une adresse de livraison'
  requirements:
    _role: 'partenaire'
    _entity_access: 'delivery_address.delete'
  options:
    parameters:
      delivery_address:
        type: entity:delivery_address
