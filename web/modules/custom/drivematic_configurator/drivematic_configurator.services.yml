services:
  drivematic_configurator.partner_discount_resolver:
    class: Drupal\drivematic_configurator\Service\PartnerDiscountResolver
  drivematic_configurator.quote_calculator:
    class: Drupal\drivematic_configurator\Service\QuoteCalculator
    arguments:
      - '@entity_type.manager'
      - '@drivematic_configurator.partner_discount_resolver'
  drivematic_configurator.quote_reference_generator:
    class: Drupal\drivematic_configurator\Service\QuoteReferenceGenerator
    arguments:
      - '@entity_type.manager'
      - '@lock'
      - '@datetime.time'
  drivematic_configurator.quote_persister:
    class: Drupal\drivematic_configurator\Service\QuotePersister
    arguments:
      - '@entity_type.manager'
      - '@drivematic_configurator.quote_calculator'
      - '@drivematic_configurator.quote_reference_generator'
      - '@datetime.time'
  drivematic_configurator.quote_pdf_generator:
    class: Drupal\drivematic_configurator\Service\QuotePdfGenerator
    arguments:
      - '@entity_type.manager'
      - '@renderer'
      - '@file_system'
      - '@extension.list.theme'
      - '@datetime.time'
      - '@date.formatter'
  drivematic_configurator.quote_vehicle_term_resolver:
    class: Drupal\drivematic_configurator\Service\QuoteVehicleTermResolver
    arguments:
      - '@entity_type.manager'
  drivematic_configurator.quote_draft_builder:
    class: Drupal\drivematic_configurator\Service\QuoteDraftBuilder
    arguments:
      - '@entity_type.manager'
      - '@drivematic_configurator.quote_vehicle_term_resolver'
