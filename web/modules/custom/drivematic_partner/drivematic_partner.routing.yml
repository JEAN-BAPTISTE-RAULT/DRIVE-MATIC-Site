drivematic_partner.personal_information:
  path: '/user/mes-informations-personnelles'
  defaults:
    _form: '\Drupal\drivematic_partner\Form\PersonalInformationForm'
    _title: 'Mes informations personnelles'
  requirements:
    _role: 'partenaire'

drivematic_partner.dashboard:
  path: '/user/tableau-de-bord'
  defaults:
    _controller: '\Drupal\drivematic_partner\Controller\DashboardController::build'
    _title: 'Tableau de bord'
  requirements:
    _role: 'partenaire'

drivematic_partner.my_quotes:
  path: '/user/mes-devis'
  defaults:
    _controller: '\Drupal\drivematic_partner\Controller\MyQuotesController::build'
    _title: 'Mes devis'
  requirements:
    _role: 'partenaire'
