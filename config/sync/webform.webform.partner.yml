      body: |-
        <div style="text-align:left;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;font-size:14px;line-height:22px;"><p style="margin:0 0 16px;"><img src="https://www.drivematiclegrand.com/themes/custom/drive_matic/images/logo-drive-matic-legrand-email.png" alt="Drive Matic Legrand" width="211" height="24" style="display:block;border:0;"></p><p style="margin:0 0 16px;">Bonjour,</p><p style="margin:0 0 16px;">Nous vous remercions pour l’intérêt que vous portez à Drive Matic Legrand et pour votre demande de partenariat. Votre demande a bien été enregistrée et sera étudiée avec attention par notre équipe. Nous reviendrons vers vous dans les meilleurs délais afin d’échanger sur votre projet. Nous vous remercions de votre confiance et espérons avoir l’opportunité de collaborer prochainement avec vous.</p><h3 style="color:#2f3a45;font-size:14px;margin:0 0 8px;text-transform:uppercase;">Vous êtes</h3><p style="margin:0 0 16px;"><strong>Entreprise :</strong> [webform_submission:values:entreprise]<br>
        <strong>Nom :</strong> [webform_submission:values:civilite] [webform_submission:values:prenom] [webform_submission:values:nom]<br>
        <strong>Adresse :</strong> [webform_submission:values:adresse] [webform_submission:values:complement] - [webform_submission:values:code_postal] [webform_submission:values:ville]<br>
        <strong>E-mail :</strong> [webform_submission:values:email]<br>
        <strong>Tél :</strong> [webform_submission:values:telephone]<br>
        <strong>Aménageur qualifié véhicule auto-école :</strong> [webform_submission:values:amenageur]</p><p style="margin:0 0 16px;"><strong>MESSAGE</strong><br>[webform_submission:values:message]</p><p style="margin:0 0 16px;">À bientôt<br><strong style="color:#aa0000;">www.drivematiclegrand.com</strong></p><p style="color:#666666;font-size:12px;line-height:18px;margin:0;">Cet e-mail vous a été envoyé par un système automatique d’émission de messages. L’adresse d’émission n’est pas une adresse de courriel classique. Si vous écrivez à cette adresse, votre message ne sera pas pris en compte.</p></div>
